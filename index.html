    <script>(function(){var p=0,f=document.getElementById('loader-fill'),t=document.getElementById('loader-pct');function tick(){p+=(Math.random()*4+1)*(1-p/150);if(p>99)p=99;if(f)f.style.width=p+'%';if(t)t.textContent=Math.floor(p)+'%';if(p<99)setTimeout(tick,100+Math.random()*80)}tick()})()</script>
